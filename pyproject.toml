[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobinsights"
version = "0.2.0"
description = "Structured insights (skills, salary, remote work) from US job postings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
llm = ["anthropic>=0.40"]
embeddings = ["sentence-transformers>=3", "umap-learn>=0.5"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jobinsights = "jobinsights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
